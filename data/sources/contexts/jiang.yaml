stimulations:
  ifnb:
    name: "Interferon beta"
    abbreviation: "IFN-beta"
    family: "type I interferon cytokine"
    receptors: ["IFNAR1", "IFNAR2"]
    signaling: "JAK1/TYK2 signaling through STAT1/STAT2-IRF9 (ISGF3), inducing interferon-stimulated genes"
    description: "Antiviral type I interferon secreted in response to pathogen sensing; induces a broad interferon-stimulated gene program that restricts viral replication and modulates innate immunity."
  ifng:
    name: "Interferon gamma"
    abbreviation: "IFN-gamma"
    family: "type II interferon cytokine"
    receptors: ["IFNGR1", "IFNGR2"]
    signaling: "JAK1/JAK2 signaling through STAT1 at gamma-activated sequence (GAS) promoter elements"
    description: "Pro-inflammatory type II interferon produced mainly by T and NK cells; activates macrophages and up-regulates MHC class I and II antigen presentation."
  ins:
    name: "Insulin"
    abbreviation: "INS"
    family: "peptide hormone"
    receptors: ["INSR"]
    signaling: "insulin receptor tyrosine kinase signaling through PI3K-AKT-mTOR and RAS-MAPK cascades"
    description: "Anabolic peptide hormone secreted by pancreatic beta cells; stimulates glucose uptake, glycogen and lipid synthesis, and cell growth."
  tgfb:
    name: "Transforming growth factor beta"
    abbreviation: "TGF-beta"
    family: "TGF-beta superfamily cytokine"
    receptors: ["TGFBR1", "TGFBR2"]
    signaling: "type I/type II receptor serine/threonine kinase signaling through SMAD2/SMAD3-SMAD4"
    description: "Pleiotropic cytokine that arrests epithelial proliferation, promotes epithelial-mesenchymal transition and extracellular-matrix production, and regulates immune tolerance."
  tnfa:
    name: "Tumor necrosis factor alpha"
    abbreviation: "TNF-alpha"
    family: "TNF superfamily pro-inflammatory cytokine"
    receptors: ["TNFRSF1A", "TNFRSF1B"]
    signaling: "TNFR1/TNFR2 signaling through NF-kappa-B and MAPK/JNK, with context-dependent caspase-8-mediated cell death"
    description: "Central pro-inflammatory cytokine; activates NF-kappa-B-dependent inflammatory gene expression and can trigger apoptosis or necroptosis depending on cellular context."
