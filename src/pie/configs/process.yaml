# pie process: raw count h5ads -> knockdown-filtered counts -> log1p expression h5ads -> DE parquets.
# Pick a dataset overlay with `dataset=<name>` (configs/process/dataset/<name>.yaml). Give `input`
# (a glob or a list of count h5ads) and each enabled stage's `output_dir` on the command line.
# Relative paths are relative to the current directory.
defaults:
  - _self_
  - process/dataset: null

input: ???
overwrite: false

filter:
  enabled: false
  perturbation_column: gene
  control_label: non-targeting
  residual_expression: 0.30
  cell_residual_expression: 0.50
  min_cells: 30
  layer: null
  var_gene_name: gene_name
  context_column: null
  output_dir: null

normalize:
  enabled: false
  target_sum: 10000.0
  output_dir: null

de:
  enabled: false
  groupby: null
  reference: null
  context_column: null
  normalize_target_sum: 10000.0
  filter_gene_min_cpm_cell: 5.0
  device: auto
  output_dir: null
