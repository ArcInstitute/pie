# @package _global_
# Within-dataset Replogle. One run per fold (vars.fold: hepg2, jurkat, k562, rpe1): train and
# validate on the other three cell lines, then evaluate best_auprc.ckpt on the fold's three test
# sets (unseen_ctx, unseen_pert, unseen_ctx_pert). train.json and val.json are the same in all
# three setting dirs of a fold.
vars:
  fold: k562

experiment_name: replogle_wdataset/${vars.fold}

data:
  preprocessed_dirs:
    - hf://datasets/arcinstitute/PIE_replogle_nadig_essential@f243f5473b68c7b62422e22645277835f9b04d0d/preprocessed
  dataset_weights: null
  split_dir: hf://datasets/arcinstitute/PIE_splits@396ab9563175ee887750c9eed7ccaea6f5fdbf50/replogle_wdataset/unseen_ctx/${vars.fold}
  source_dirs:
    esm2: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/esm2
    ncbi_text: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/ncbi_text
    string_space: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/string_space
    depmap_gene_effect: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/depmap_gene_effect
    context_text: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/context_text
    perturbation_text: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/perturbation_text
  gene_text_dir: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/gene_text
  delta_p:
    bin_width_fold_change: 1.1
  evidence:
    seed: 42
    chunk: 256

trainer:
  devices: 2
  num_nodes: 1
  max_steps: 5000
  accumulate_grad_batches: 4

logger:
  group: replogle_wdataset
  tags:
    - replogle_wdataset
    - ${vars.fold}
