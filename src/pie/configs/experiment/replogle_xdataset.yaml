# @package _global_
# Cross-dataset: train on Tahoe, Jiang, ARC VCC 25 and Orion; evaluate best_auprc.ckpt zero-shot on
# Replogle (test_seen.json, test_unseen.json). Replogle stays first with weight 0 and no training
# rows: it fixes the gene-axis order and the sorted dataset ids that seed the sampler.
experiment_name: replogle_xdataset

data:
  preprocessed_dirs:
    - hf://datasets/arcinstitute/PIE_replogle_nadig_essential@f243f5473b68c7b62422e22645277835f9b04d0d/preprocessed
    - hf://datasets/arcinstitute/PIE_tahoe100m@8f003b086289aecfa6f2f07e3ba49738f69fa69b/preprocessed
    - hf://datasets/arcinstitute/PIE_jiang@bcf4ceedd2e1232e8a3a362c1a10b1c49c3585ac/preprocessed
    - hf://datasets/arcinstitute/PIE_arc_vcc_25@fe629a02e7d584c4b6fd0f9ea0865aa584cb854f/preprocessed
    - hf://datasets/arcinstitute/PIE_x_atlas_orion@516a10f46461f168cc5dde5c3b449e9c45c70b8f/preprocessed
  dataset_weights:
    replogle: 0.0
    tahoe: 0.68
    jiang: 0.01
    arc_vcc_25: 0.01
    orion: 0.3
  split_dir: hf://datasets/arcinstitute/PIE_splits@396ab9563175ee887750c9eed7ccaea6f5fdbf50/replogle_xdataset
  source_dirs:
    esm2: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/esm2
    ncbi_text: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/ncbi_text
    string_space: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/string_space
    depmap_gene_effect: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/depmap_gene_effect
    context_text: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/context_text
    perturbation_text: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/perturbation_text
    smiles: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/smiles
    l1000_tas: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/l1000_tas
    prism_secondary: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/prism_secondary
    jump_morphology: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/jump_morphology
  gene_text_dir: hf://datasets/arcinstitute/PIE_sources@7a27f6e647d8d3d640a37b3c7f0c93559a628b37/gene_text
  delta_p:
    bin_width_fold_change: 1.01
  evidence:
    seed: 0
    chunk: 2048

trainer:
  devices: 4
  num_nodes: 2
  max_steps: 10000
  accumulate_grad_batches: 1

logger:
  group: replogle_xdataset
  tags:
    - replogle_xdataset
