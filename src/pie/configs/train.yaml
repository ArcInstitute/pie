# PIE training recipe shared by every experiment. An experiment overlay
# (experiment=<name>, from configs/experiment/) fills every ??? value.
defaults:
  - _self_
  - experiment: null

vars: {}
experiment_name: ???
seed: 42
run_dir: ${oc.env:PIE_RUNS_ROOT}/${experiment_name}
overwrite: false
resume: false

data:
  preprocessed_dirs: ???
  dataset_weights: ???
  split_dir: ???
  source_dirs: ???
  gene_text_dir: ${oc.env:PIE_DATA_ROOT}/sources/gene_text
  aliases_path: data/sources/aliases.yaml
  delta_p:
    bin_width_fold_change: ???
  evidence:
    seed: ???
    chunk: ???
    lfc_clip_percentile: 95.0
  batch_size: 16
  num_workers: 4
  fdr_threshold: 0.05

model:
  d_model: 768
  n_latents: 512
  n_encoder_layers: 4
  n_processor_layers: 6
  n_decoder_layers: 4
  num_heads: 8
  ff_mult: 2
  dropout: 0.1
  drop_src: 0.05
  inference_chunk_size: 2048
  class_weight_cap: 10.0
  class_weight_cap_delta_p: 5.0
  lfc_huber_delta: 1.0
  lfc_target_gene_alpha: 0.001
  lfc_direction_temperature: 0.25
  evidence:
    encoder_dim: 64
    dim: 128
    dropout: 0.1
    response_dropout: 0.25
  temperature:
    de: 4.0
    delta_p: 4.5

optimizer:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  warmup_fraction: 0.05
  constant_steps: 4250
  eta_min: 1.0e-6

trainer:
  accelerator: gpu
  devices: ???
  num_nodes: ???
  precision: bf16-mixed
  max_steps: ???
  accumulate_grad_batches: ???
  val_every_n_steps: 100
  gradient_clip_val: 10.0
  log_every_n_steps: 50

logger:
  enabled: true
  group: null
  tags: []
