# @package _global_
# Cross-dataset: train on Tahoe, Jiang, ARC VCC 25 and Orion; evaluate best_auprc.ckpt zero-shot on
# Replogle (test_seen.json, test_unseen.json). Replogle stays first with weight 0 and no training
# rows: it fixes the gene-axis order and the sorted dataset ids that seed the sampler.
experiment_name: replogle_xdataset

data:
  preprocessed_dirs:
    - hf://datasets/arcinstitute/pie_replogle_nadig_essential@20c9faef76fc96fdc809871340bd93499413dfe7/preprocessed
    - hf://datasets/arcinstitute/pie_tahoe100m@597d6ded9f9a148331388484ffb193489121c702/preprocessed
    - hf://datasets/arcinstitute/pie_jiang@99242356dfcf58e049d867703c5743df8d1790bf/preprocessed
    - hf://datasets/arcinstitute/pie_arc_vcc_25@e7dda6065316959958b87583ddf0a15f6e69c37d/preprocessed
    - hf://datasets/arcinstitute/pie_x_atlas_orion@0950c8aa5ce5b33dc9d6f0c5eade3ae445ca0ffb/preprocessed
  dataset_weights:
    replogle: 0.0
    tahoe: 0.68
    jiang: 0.01
    arc_vcc_25: 0.01
    orion: 0.3
  split_dir: data/splits/replogle_xdataset
  source_dirs:
    esm2: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/esm2
    ncbi_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/ncbi_text
    string_space: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/string_space
    depmap_gene_effect: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/depmap_gene_effect
    context_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/context_text
    perturbation_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/perturbation_text
    smiles: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/smiles
    l1000_tas: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/l1000_tas
    prism_secondary: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/prism_secondary
    jump_morphology: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/jump_morphology
  gene_text_dir: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/gene_text
  delta_p:
    bin_width_fold_change: 1.01
  evidence:
    seed: 0
    chunk: 2048

trainer:
  devices: 4
  num_nodes: 2
  max_steps: 10000
  accumulate_grad_batches: 1

logger:
  group: replogle_xdataset
  tags:
    - replogle_xdataset
