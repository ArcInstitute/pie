# @package _global_
# Within-dataset Replogle. One run per fold (vars.fold: hepg2, jurkat, k562, rpe1): train and
# validate on the other three cell lines, then evaluate best_auprc.ckpt on the fold's three test
# sets (unseen_ctx, unseen_pert, unseen_ctx_pert). train.json and val.json are the same in all
# three setting dirs of a fold.
vars:
  fold: k562

experiment_name: replogle_wdataset/${vars.fold}

data:
  preprocessed_dirs:
    - hf://datasets/arcinstitute/pie_replogle_nadig_essential@20c9faef76fc96fdc809871340bd93499413dfe7/preprocessed
  dataset_weights: null
  split_dir: data/splits/replogle_wdataset/unseen_ctx/${vars.fold}
  source_dirs:
    esm2: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/esm2
    ncbi_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/ncbi_text
    string_space: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/string_space
    depmap_gene_effect: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/depmap_gene_effect
    context_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/context_text
    perturbation_text: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/perturbation_text
  gene_text_dir: hf://datasets/arcinstitute/pie_sources@cb1aaa4e7655605bdc70a9bd77bbd62016b8c7d7/gene_text
  delta_p:
    bin_width_fold_change: 1.1
  evidence:
    seed: 42
    chunk: 256

trainer:
  devices: 2
  num_nodes: 1
  max_steps: 5000
  accumulate_grad_batches: 4

logger:
  group: replogle_wdataset
  tags:
    - replogle_wdataset
    - ${vars.fold}
