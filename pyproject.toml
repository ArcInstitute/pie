[project]
name = "pie"
version = "0.1.0"
description = "PIE: predicting transcriptional responses to perturbations from biological knowledge sources"
requires-python = "==3.12.*"
dependencies = [
    "anndata==0.13.2",
    "h5py==3.16.0",
    "hydra-core==1.3.3",
    "lightning==2.6.5",
    "numpy==2.4.6",
    "omegaconf==2.3.1",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    "pydantic==2.13.4",
    "safetensors==0.8.0",
    "scipy==1.18.0",
    "torch==2.10.0",
    "tqdm==4.68.3",
    "wandb==0.28.0",
]

[project.optional-dependencies]
process = [
    "gpudge[fast] @ git+https://github.com/ArcInstitute/gpudge.git@bfbde26903b5580a4cf7692985f7b3c20f3bfebd",
]
sources = [
    "huggingface-hub==1.21.0",
    "openai==2.44.0",
    "rdkit==2026.3.6",
    "requests==2.34.2",
    "tiktoken==0.13.0",
    "transformers==5.12.1",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pie"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
override-dependencies = ["torch==2.10.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pie"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[project.scripts]
pie-prep = "pie.cli:prep_main"
pie-process = "pie.cli:process_main"
